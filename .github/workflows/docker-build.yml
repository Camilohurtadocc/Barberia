name: Build and Push Docker Images

on:
  push:
    branches: [ master ]
    paths:
      - 'Barberia-*/**'
      - 'barberia-frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========== Gateway ==========
      - name: Build Gateway JAR
        run: |
          cd Barberia-gateway
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Build and push Gateway image
        uses: docker/build-push-action@v4
        with:
          context: ./Barberia-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/barberia-gateway:latest

      # ========== Catalogo ==========
      - name: Build Catalogo JAR
        run: |
          cd Barberia-servicios
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Build and push Catalogo image
        uses: docker/build-push-action@v4
        with:
          context: ./Barberia-servicios
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/barberia-catalogo:latest

      # ========== Barberos ==========
      - name: Build Barberos JAR
        run: |
          cd Barberia-barberos
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Build and push Barberos image
        uses: docker/build-push-action@v4
        with:
          context: ./Barberia-barberos
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/barberia-barberos:latest

      # ========== Citas ==========
      - name: Build Citas JAR
        run: |
          cd Barberia-citas
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Build and push Citas image
        uses: docker/build-push-action@v4
        with:
          context: ./Barberia-citas
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/barberia-citas:latest

      # ========== Auth ==========
      - name: Build Auth JAR
        run: |
          cd Barberia-auth
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Build and push Auth image
        uses: docker/build-push-action@v4
        with:
          context: ./Barberia-auth
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/barberia-auth:latest

      # ========== Frontend ==========
      - name: Build Frontend
        run: |
          cd barberia-frontend
          npm install
          npm run build

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./barberia-frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/barberia-frontend:latest