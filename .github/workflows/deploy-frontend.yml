name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'barberia-frontend/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
         uses: actions/setup-node@v3
          with:
           node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ./barberia-frontend

      - name: Build project
        run: npm run build
        working-directory: ./barberia-frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./barberia-frontend/dist/spa