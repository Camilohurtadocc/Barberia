# Configuracion de nginx para la SPA de Quasar.
#
# Existe por un problema concreto y repetido: por defecto nginx no manda
# Cache-Control, solo ETag y Last-Modified. Sin Cache-Control el navegador aplica
# su heuristica y puede servir un index.html viejo SIN preguntar al servidor.
# Como el index.html es quien apunta al bundle con hash, un HTML cacheado carga
# JavaScript antiguo: aparecen rutas que "no existen", pantallas en blanco y
# cambios que "no se reflejan" aunque el contenedor este recien construido.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # index.html: NUNCA se cachea.
    #
    # Es el unico archivo cuyo nombre no cambia entre despliegues, asi que es el
    # unico que puede quedarse obsoleto sin que nada lo delate. Pesa unos pocos
    # kilobytes: revalidarlo en cada carga no cuesta nada.
    # -----------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # -----------------------------------------------------------------------
    # assets/: se cachean para siempre, justo por lo contrario.
    #
    # Vite les pone un hash del contenido en el nombre (index-BHxsddvl.js), asi
    # que un archivo distinto SIEMPRE tiene otro nombre. 'immutable' le dice al
    # navegador que ni se moleste en revalidar.
    # -----------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Resto: fallback de SPA.
    #
    # Ahora mismo la app usa modo hash (/#/admin), donde el servidor solo ve '/'
    # y esto no hace falta. Se deja puesto para que cambiar a modo history no
    # empiece a devolver 404 al recargar una ruta interna.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
