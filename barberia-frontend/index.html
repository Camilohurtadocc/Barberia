<!doctype html>
<html>
  <head>
    <title><%= productName %></title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <!--
      OJO con connect-src y con img-src: el frontend se sirve en el puerto 80 y el
      gateway vive en el 8080. Para el navegador un puerto distinto ya es OTRO
      origen, asi que hay que listarlo explicitamente en las dos directivas.

      connect-src: antes solo se abria en modo dev (ctx.dev), y por eso en el build
      de produccion 'default-src self' bloqueaba TODAS las llamadas al gateway; el
      login fallaba con "Sin respuesta de localhost:8080" aunque los contenedores
      estuvieran perfectos.

      img-src: 'https:' cubre las fotos de ejemplo de Unsplash, pero NO las que
      sube el administrador, que se sirven por HTTP desde el gateway
      (/api/archivos/...). Sin el origen explicito la imagen se sube bien y luego
      el navegador se niega a pintarla.

      Si algun dia sirves esto en un dominio real, cambia http://localhost:8080
      por la URL publica del gateway (la misma de VITE_GATEWAY_URL) en AMBAS.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https: http://localhost:8080;
        connect-src 'self' http://localhost:8080<% if (ctx.dev) { %> ws://localhost:*<% } %>;
        <% if (ctx.dev) { %>worker-src 'self' blob:;<% } %>
      "
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
