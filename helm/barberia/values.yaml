replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Tag que se le pone a TODAS las imagenes de la barberia.
#
# Debe cambiar en cada despliegue, y por eso desplegar.ps1 lo pisa con una marca
# de tiempo (--set imageTag=...). El valor de aqui es solo el de emergencia,
# para un 'helm template' suelto.
#
# El motivo esta explicado a fondo en el template "barberia.componente", pero en
# corto: el Kubernetes de Docker Desktop corre sobre containerd, que no comparte
# almacen con el demonio Docker donde construimos. Docker Desktop copia la
# imagen cuando kubelet la pide, y con un tag repetido kubelet no pide nada
# porque cree que ya la tiene. Resultado: se reconstruia todo y el cluster
# seguia ejecutando la version del dia anterior.
imageTag: latest

# Nombres de imagen SIN tag: el tag lo pone imageTag. Ninguna de estas imagenes
# se publica en un registro, se construyen en local con desplegar.ps1.
servicios:
  catalogo:
    enabled: true
    image: barberia-servicio-catalogo
    port: 8081
    servicePort: 8081
    containerPort: 8081
    env:
      # El host es 'postgres': el nombre del Service de Kubernetes, no localhost.
      # Estas variables PISAN el spring.datasource.url del application.yml, que
      # apunta a localhost:5433 para poder arrancar el servicio desde el IDE.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/barberia_servicios"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "admin123"

  gateway:
    enabled: true
    image: barberia-gateway
    port: 8080
    servicePort: 8080
    containerPort: 8080
    # Único servicio que se publica fuera del clúster: es la puerta de entrada.
    #
    # LoadBalancer y no ClusterIP porque, con ClusterIP, llegar a la aplicación
    # exigía dejar un 'kubectl port-forward' abierto en una terminal. Ese proceso
    # muere al cerrar la ventana, y entonces localhost:8080 responde
    # ERR_CONNECTION_REFUSED aunque los siete pods estén perfectamente arriba:
    # parece que el despliegue ha fallado cuando en realidad solo faltaba el túnel.
    #
    # Docker Desktop implementa LoadBalancer publicando el servicio en localhost,
    # así que el sitio queda accesible en http://localhost:8080 mientras el clúster
    # esté encendido, sin nada que mantener a mano.
    serviceType: LoadBalancer
    env:
      SERVICIO_CATALOGO_URI: "http://servicio-catalogo:8081"
      SERVICIO_BARBEROS_URI: "http://servicio-barberos:8082"
      SERVICIO_CITAS_URI: "http://servicio-citas:8083"
      SERVICIO_AUTH_URI: "http://servicio-auth:8084"
      # Destino del comodin '/**' del gateway: el nginx que sirve la SPA. Sin
      # esta variable el gateway caia en su valor por defecto (localhost:9000,
      # el servidor de desarrollo de Quasar) y la raiz devolvia 404 dentro del
      # cluster.
      FRONTEND_URI: "http://barberia-frontend:80"

  barberos:
    enabled: true
    image: barberia-servicio-barberos
    port: 8082
    servicePort: 8082
    containerPort: 8082
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/barberia_barberos"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "admin123"

  citas:
    enabled: true
    image: barberia-servicio-citas
    port: 8083
    servicePort: 8083
    containerPort: 8083
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/barberia_citas"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "admin123"

  auth:
    enabled: true
    image: barberia-servicio-auth
    port: 8084
    servicePort: 8084
    containerPort: 8084
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/barberia_auth"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "admin123"

  frontend:
    enabled: true
    image: barberia-frontend
    port: 80
    servicePort: 80
    containerPort: 80

postgres:
  enabled: true
  image: postgres:15
  port: 5432
  # Tamano del PVC. Las 4 bases juntas ocupan unos pocos MB; 2Gi sobra y es lo
  # minimo comodo para la StorageClass hostpath de Docker Desktop.
  storage: 2Gi
  env:
    POSTGRES_PASSWORD: "admin123"

ingress:
  enabled: false
